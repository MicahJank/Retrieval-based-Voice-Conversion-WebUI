name: Unit Test
on: [ push, pull_request ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10"]
        os: [ubuntu-latest]
      fail-fast: false

    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt -y install ffmpeg
        sudo apt -y install -qq aria2
        aria2c --console-log-level=error -c -x 16 -s 16 -k 1M https://huggingface.co/lj1995/VoiceConversionWebUI/resolve/e6d0c1a17da07c33557852f9dfa2bd44cc75737d/hubert_base.pt -d assets/hubert -o hubert_base.pt
        echo "f54b40fd2802423a5643779c4861af1e9ee9c1564dc9d32f54f20b5ffba7db96  assets/hubert/hubert_base.pt" | sha256sum --check
        # Current uv normalizes OmegaConf 2.0's invalid PyYAML>=5.1.* metadata.
        # Preserve fairseq compatibility without downgrading pip or skipping dependencies.
        python -m pip install --disable-pip-version-check --no-deps "uv @ https://files.pythonhosted.org/packages/4b/a1/de02c0913726728eca56ee258875cbba9c7b0572c63f494fd9f55c7852e3/uv-0.13.4-py3-none-manylinux_2_17_x86_64.manylinux2014_x86_64.whl#sha256=05e4332791b4d55b6dde8695b7fa6079b26991519f44760887c5dfbd5ca4fe53"
        uv pip install --system torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
        uv pip install --system -r requirements.txt
        uv pip check
    - name: Test step 1 & 2
      run: |
        python tools/ci_audio_smoke.py prepare
        mkdir -p logs/mi-test
        touch logs/mi-test/preprocess.log
        python infer/modules/train/preprocess.py logs/ci-input 48000 1 logs/mi-test True 3.7
        touch logs/mi-test/extract_f0_feature.log
        python infer/modules/train/extract/extract_f0_print.py logs/mi-test $(nproc) pm
        # Legacy fairseq checkpoints include Python objects. This exception applies
        # only to the exact upstream test checkpoint verified by SHA-256 above.
        TORCH_FORCE_NO_WEIGHTS_ONLY_LOAD=1 python infer/modules/train/extract_feature_print.py cpu 1 0 0 logs/mi-test v1
        python tools/ci_audio_smoke.py verify
